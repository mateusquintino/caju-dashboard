<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gestão de Usuários — Preview · Cajupar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --or1:#E8430A;--or2:#F5853A;--glow2:rgba(245,133,58,.10);
  --c-fin:#E8430A;--c-rh:#8B5CF6;--c-dir:#3B82F6;--c-soc:#10B981;
  --t:200ms cubic-bezier(.4,0,.2,1)
}
html[data-theme="dark"]{
  --bg:#0C0C0C;--bg2:#141414;--bg3:#1C1C1C;--bg4:#242424;
  --bd:rgba(255,255,255,.07);--bdh:rgba(255,255,255,.14);
  --t1:#F0EFE8;--t2:#9A9990;--t3:#5A5955;
  --sh:0 2px 16px rgba(0,0,0,.5);--sh2:0 8px 40px rgba(0,0,0,.7);
  --stripe:rgba(255,255,255,.016)
}
html[data-theme="light"]{
  --bg:#F2F1ED;--bg2:#ECEAE5;--bg3:#E5E3DD;--bg4:#DDDBD5;
  --bd:rgba(0,0,0,.08);--bdh:rgba(0,0,0,.16);
  --t1:#1A1917;--t2:#5A5855;--t3:#9A9890;
  --sh:0 2px 16px rgba(0,0,0,.07);--sh2:0 8px 40px rgba(0,0,0,.12);
  --stripe:rgba(0,0,0,.016)
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;transition:background var(--t),color var(--t)}
.wrap{max-width:1180px;margin:0 auto;padding:1.5rem 1.6rem 4rem}

/* topbar */
.top{display:flex;align-items:center;gap:14px;margin-bottom:2rem}
.logo-mini{width:34px;height:34px;flex-shrink:0}
.top h1{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.top .sub{font-size:.72rem;color:var(--t3);font-family:'DM Mono',monospace}
.spacer{flex:1}
.tgl{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);
  color:var(--t2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all var(--t)}
.tgl:hover{border-color:var(--bdh);color:var(--t1)}
.pill-note{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--or2);
  background:var(--glow2);border:1px solid rgba(245,133,58,.25);padding:4px 10px;border-radius:999px}

/* KPIs */
.kpis{display:flex;gap:.8rem;margin-bottom:2rem;flex-wrap:wrap}
.kpi{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:.9rem 1.2rem;min-width:120px;flex:1}
.kpi-lbl{font-size:.56rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:.35rem}
.kpi-val{font-family:'DM Mono',monospace;font-size:1.5rem}

/* section header */
.shdr{display:flex;align-items:center;gap:12px;margin:2rem 0 1rem}
.shdr .stit{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t2)}
.shdr .sln{flex:1;height:1px;background:var(--bd)}
.cnt{background:var(--bg3);color:var(--t2);font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:999px;font-family:'DM Mono',monospace}

/* toolbar */
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;height:42px;padding:0 14px 0 40px;border-radius:11px;border:1px solid var(--bd);
  background:var(--bg2);color:var(--t1);font-family:'Syne';font-size:.9rem;transition:border var(--t)}
.search input:focus{outline:none;border-color:var(--or1)}
.search svg{position:absolute;left:13px;top:12px;color:var(--t3)}

/* buttons */
.bp{background:linear-gradient(135deg,var(--or1),var(--or2));color:#fff;border:none;border-radius:11px;
  padding:0 18px;height:42px;font-family:'Syne';font-weight:600;font-size:.86rem;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:transform var(--t),box-shadow var(--t)}
.bp:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--glow2)}
.bs{background:var(--bg3);color:var(--t1);border:1px solid var(--bd);border-radius:11px;
  padding:0 16px;height:42px;font-family:'Syne';font-weight:500;font-size:.86rem;cursor:pointer;transition:all var(--t)}
.bs:hover{border-color:var(--bdh)}

/* solicitações cards */
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.req{background:var(--bg2);border:1px solid var(--bd);border-radius:13px;padding:1rem 1.1rem;
  display:flex;flex-direction:column;gap:.7rem;border-left:3px solid var(--or2)}
.req.pwd{border-left-color:var(--c-dir)}
.req-top{display:flex;align-items:center;gap:10px}
.avt{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.82rem;color:#fff;flex-shrink:0}
.req-name{font-weight:600;font-size:.92rem}
.req-mail{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--t2)}
.req-tag{font-size:.58rem;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:6px;text-transform:uppercase}
.tag-cad{background:var(--glow2);color:var(--or2)}
.tag-pwd{background:rgba(59,130,246,.14);color:var(--c-dir)}
.req-actions{display:flex;gap:8px}
.req-actions button{flex:1;height:36px;border-radius:9px;font-family:'Syne';font-weight:600;font-size:.8rem;cursor:pointer;
  border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all var(--t)}
.ap{background:rgba(16,185,129,.14);color:#10B981;border-color:rgba(16,185,129,.3)}
.ap:hover{background:rgba(16,185,129,.24)}
.rj{background:rgba(239,68,68,.1);color:#EF4444;border-color:rgba(239,68,68,.28)}
.rj:hover{background:rgba(239,68,68,.2)}

/* user cards */
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-top:1rem}
.ucard{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:1.1rem 1.2rem;transition:border var(--t),transform var(--t)}
.ucard:hover{border-color:var(--bdh);transform:translateY(-2px)}
.ucard-top{display:flex;align-items:center;gap:11px;margin-bottom:.9rem}
.ucard-name{font-weight:600;font-size:.98rem;display:flex;align-items:center;gap:6px}
.ucard-mail{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--t2)}
.gbadge{font-size:.58rem;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:6px;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.9rem}
.chiplet{font-size:.62rem;color:var(--t2);background:var(--bg3);border:1px solid var(--bd);padding:3px 9px;border-radius:999px;
  display:inline-flex;align-items:center;gap:5px}
.you{font-size:.56rem;color:var(--t3);font-weight:700}
.ucard-foot{display:flex;gap:6px;border-top:1px solid var(--bd);padding-top:.8rem}
.iact{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:none;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;color:var(--t2);transition:all .15s}
.iact:hover{color:var(--t1);border-color:var(--bdh);background:var(--bg3)}
.iact.dg:hover{color:#EF4444;border-color:rgba(239,68,68,.4)}
.role-adm{background:rgba(232,67,10,.15);color:var(--or1)}

/* modal */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;
  align-items:center;justify-content:center;z-index:50;opacity:0;transition:opacity var(--t);padding:1rem}
.mov.op{opacity:1}
.mod{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:560px;
  max-height:92vh;overflow:auto;box-shadow:var(--sh2);transform:translateY(8px);transition:transform var(--t)}
.mov.op .mod{transform:translateY(0)}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 1.4rem;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg2)}
.mhd h3{font-size:1.05rem;font-weight:700}
.mcl{background:none;border:none;color:var(--t2);font-size:1.1rem;cursor:pointer;width:30px;height:30px;border-radius:8px}
.mcl:hover{background:var(--bg3);color:var(--t1)}
.mbd{padding:1.3rem 1.4rem;display:flex;flex-direction:column;gap:1rem}
.mfo{padding:1rem 1.4rem;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--bg2)}
.mft{display:flex;flex-direction:column;gap:.35rem}
.mfr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mft label{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.fi2{height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--t1);
  font-family:'Syne';font-size:.9rem;transition:border var(--t)}
.fi2:focus{outline:none;border-color:var(--or1)}
.mlbl{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:.15rem}

/* group selector */
.gsel{display:flex;gap:8px;flex-wrap:wrap}
.gopt{padding:8px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;
  font-size:.82rem;color:var(--t2);font-weight:500;transition:all var(--t)}
.gopt.on{color:#fff;border-color:transparent}

/* empresas checklist */
.emps{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:210px;overflow:auto;
  border:1px solid var(--bd);border-radius:11px;padding:.6rem}
.emp{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:.82rem;transition:background var(--t)}
.emp:hover{background:var(--bg3)}
.emp input,.pchk input{width:16px;height:16px;accent-color:var(--or1);cursor:pointer;flex-shrink:0}
.selall{font-size:.72rem;color:var(--or2);cursor:pointer;font-weight:600}

/* permissions table */
.ptbl{border:1px solid var(--bd);border-radius:11px;overflow:hidden}
.prow{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border-bottom:1px solid var(--bd)}
.prow:last-child{border-bottom:none}
.prow:nth-child(even){background:var(--stripe)}
.pname{font-size:.84rem}
.pgrp{display:flex;gap:22px}
.pchk{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--t2);cursor:pointer;user-select:none}
.phead{display:flex;justify-content:flex-end;gap:22px;padding:6px 13px;font-size:.6rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--t3);background:var(--bg3)}
.phead span{width:56px;text-align:center}

/* toast */
.tst{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg4);
  color:var(--t1);border:1px solid var(--bd);padding:12px 20px;border-radius:11px;box-shadow:var(--sh2);
  font-size:.86rem;font-weight:500;opacity:0;pointer-events:none;transition:all var(--t);z-index:60}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--t3);font-size:.86rem;padding:1.5rem;text-align:center;grid-column:1/-1}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <svg class="logo-mini" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="450 353 206 220">
      <defs>
        <linearGradient id="lg" x1="516.2" y1="373.76" x2="662.67" y2="520.23" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#f8992d"/><stop offset=".45" stop-color="#ef4237"/><stop offset=".99" stop-color="#010101"/>
        </linearGradient>
        <linearGradient id="lg2" x1="462.81" y1="427.16" x2="609.28" y2="573.63" xlink:href="#lg"/>
      </defs>
      <path fill="url(#lg)" d="M551.85,362.43v30.08c1.81,0,3.58.14,5.3.36.82.09,1.63.23,2.4.41,18.48,3.58,32.39,19.84,32.39,39.37,0,22.15-17.94,40.14-40.09,40.14-.59,0-1.13,0-1.72-.05-3.99,22.83,13.36,42.9,40.82,42.9,30.49,0,53.68-24.37,53.68-61.21,0-50.2-38.64-92.01-92.78-92.01Z"/>
      <path fill="url(#lg2)" d="M551.75,563.07v-30.08c-1.81,0-3.58-.14-5.3-.36-.82-.09-1.63-.23-2.4-.41-18.48-3.58-32.39-19.84-32.39-39.37,0-22.15,17.94-40.14,40.09-40.14.59,0,1.13,0,1.72.05,3.99-22.83-13.36-42.9-40.82-42.9-30.49,0-53.68,24.37-53.68,61.21,0,50.2,38.64,92.01,92.78,92.01Z"/>
    </svg>
    <div>
      <h1>Gestão de Usuários</h1>
      <div class="sub">Dashboard Financeiro · @cajupar.com</div>
    </div>
    <div class="spacer"></div>
    <span class="pill-note">Preview</span>
    <button class="tgl" id="tglBtn" onclick="toggleTema()" title="Alternar tema">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="shdr"><span class="stit">Solicitações</span><span class="cnt" id="reqCnt">0</span><span class="sln"></span></div>
  <div class="reqs" id="reqs"></div>

  <div class="shdr"><span class="stit">Usuários</span><span class="sln"></span></div>
  <div class="tbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="busca" placeholder="Buscar por nome ou e-mail..." oninput="renderUsers()"/>
    </div>
    <button class="bp" onclick="openUser()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Novo usuário
    </button>
  </div>
  <div class="users" id="users"></div>

</div>

<!-- MODAL USUÁRIO -->
<div class="mov" id="modUser">
  <div class="mod">
    <div class="mhd"><h3 id="muTit">Novo usuário</h3><button class="mcl" onclick="closeUser()">✕</button></div>
    <div class="mbd">
      <input type="hidden" id="muId"/>
      <div class="mfr">
        <div class="mft"><label>Nome completo</label><input class="fi2" id="muNome" placeholder="Nome do colaborador"/></div>
        <div class="mft"><label>E-mail corporativo</label><input class="fi2" id="muMail" placeholder="nome@cajupar.com"/></div>
      </div>

      <div class="mft">
        <span class="mlbl">Grupo de acesso</span>
        <div class="gsel" id="gsel"></div>
      </div>

      <div class="mft">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="mlbl">Empresas vinculadas</span>
          <span class="selall" id="selAll" onclick="toggleAllEmp()">Selecionar todas</span>
        </div>
        <div class="emps" id="emps"></div>
      </div>

      <div class="mft">
        <span class="mlbl">Permissões por módulo</span>
        <div class="phead"><span>Ver</span><span>Editar</span></div>
        <div class="ptbl" id="ptbl"></div>
      </div>
    </div>
    <div class="mfo">
      <button class="bs" onclick="closeUser()">Cancelar</button>
      <button class="bp" onclick="saveUser()">Salvar usuário</button>
    </div>
  </div>
</div>

<!-- MODAL SENHA -->
<div class="mov" id="modSenha">
  <div class="mod" style="max-width:420px">
    <div class="mhd"><h3>Alterar senha</h3><button class="mcl" onclick="closeSenha()">✕</button></div>
    <div class="mbd">
      <input type="hidden" id="msId"/>
      <p id="msNome" style="font-size:.8rem;color:var(--t2)"></p>
      <div class="mft"><label>Nova senha</label><input class="fi2" type="password" id="msS1" placeholder="Mínimo 6 caracteres"/></div>
      <div class="mft"><label>Confirmar senha</label><input class="fi2" type="password" id="msS2" placeholder="Repita a nova senha"/></div>
      <div id="msErr" style="font-size:.76rem;color:#EF4444;min-height:1rem"></div>
    </div>
    <div class="mfo">
      <button class="bs" onclick="closeSenha()">Cancelar</button>
      <button class="bp" onclick="saveSenha()">Salvar senha</button>
    </div>
  </div>
</div>

<div class="tst" id="toast"></div>

<script>
/* ══ dados de exemplo (preview — nada é salvo) ══ */
const GRUPOS = [
  {id:"Financeiro", cor:"var(--c-fin)", hex:"#E8430A"},
  {id:"RH",         cor:"var(--c-rh)",  hex:"#8B5CF6"},
  {id:"Diretoria",  cor:"var(--c-dir)", hex:"#3B82F6"},
  {id:"Sócio proprietário", cor:"var(--c-soc)", hex:"#10B981"}
];
const grpHex = g => (GRUPOS.find(x=>x.id===g)||{}).hex || "#888";

const EMPRESAS = ["MULT 01 - CPD","MULT 02 - NZ GO","NFE 01 - NZ AS","CAJU 01 - ASN","CAJU 03 - SIG",
  "CAJU Itaim/SP","Responsa Bar","FB01 - ASS","FB02 - ASN Bosque","FB03 - AC","Caminito","Holding Cajupar"];

const MODULOS = ["Visão geral","Fluxo de caixa","Movimentações","Contas bancárias","Tarifas","Importar OFX","Empréstimos","Usuários"];

/* modelo padrão de permissões por grupo */
const V="view",E="edit",N="none";
function permsPadrao(g){
  const all=v=>Object.fromEntries(MODULOS.map(m=>[m,v]));
  if(g==="Sócio proprietário") return all(E);
  if(g==="Diretoria") { const p=all(V); p["Usuários"]=N; return p; }
  if(g==="Financeiro"){ return {"Visão geral":V,"Fluxo de caixa":E,"Movimentações":E,"Contas bancárias":E,"Tarifas":E,"Importar OFX":E,"Empréstimos":V,"Usuários":N}; }
  return {"Visão geral":V,"Fluxo de caixa":V,"Movimentações":N,"Contas bancárias":N,"Tarifas":N,"Importar OFX":N,"Empréstimos":N,"Usuários":V}; // RH
}

let USERS = [
  {id:1,nome:"Mateus Quintino",email:"mateusquintino@cajupar.com",grupo:"Sócio proprietário",role:"admin",status:"active",you:true,
   empresas:[...EMPRESAS],perms:permsPadrao("Sócio proprietário")},
  {id:2,nome:"Ana Beatriz Lima",email:"ana.lima@cajupar.com",grupo:"Financeiro",role:"user",status:"active",
   empresas:["MULT 01 - CPD","MULT 02 - NZ GO","CAJU 01 - ASN","Responsa Bar"],perms:permsPadrao("Financeiro")},
  {id:3,nome:"Carla Menezes",email:"carla.rh@cajupar.com",grupo:"RH",role:"user",status:"active",
   empresas:["Holding Cajupar","CAJU 01 - ASN"],perms:permsPadrao("RH")},
  {id:4,nome:"Roberto Andrade",email:"roberto.dir@cajupar.com",grupo:"Diretoria",role:"user",status:"active",
   empresas:[...EMPRESAS],perms:permsPadrao("Diretoria")}
];

/* solicitações: cadastro novo + redefinição de senha */
let REQS = [
  {id:101,tipo:"cadastro",nome:"Lucas Almeida",email:"lucas.almeida@cajupar.com",quando:"hoje, 09:12"},
  {id:102,tipo:"cadastro",nome:"Marina Souza",email:"marina.souza@cajupar.com",quando:"ontem, 17:40"},
  {id:103,tipo:"senha",nome:"Ana Beatriz Lima",email:"ana.lima@cajupar.com",quando:"hoje, 08:05"}
];

let _id=1000;
const iniciais = n => n.split(" ").filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();

/* ── render KPIs ── */
function renderKpis(){
  const total=USERS.length, ativos=USERS.filter(u=>u.status==="active").length,
        adms=USERS.filter(u=>u.role==="admin").length, pend=REQS.length;
  document.getElementById("kpis").innerHTML=`
    <div class="kpi"><div class="kpi-lbl">Total</div><div class="kpi-val">${total}</div></div>
    <div class="kpi"><div class="kpi-lbl">Ativos</div><div class="kpi-val" style="color:#10B981">${ativos}</div></div>
    <div class="kpi"><div class="kpi-lbl">Administradores</div><div class="kpi-val" style="color:var(--or1)">${adms}</div></div>
    <div class="kpi"><div class="kpi-lbl">Solicitações</div><div class="kpi-val" style="color:var(--or2)">${pend}</div></div>`;
}

/* ── render solicitações ── */
function renderReqs(){
  document.getElementById("reqCnt").textContent=REQS.length;
  const el=document.getElementById("reqs");
  if(!REQS.length){ el.innerHTML=`<div class="empty">Nenhuma solicitação pendente.</div>`; return; }
  el.innerHTML=REQS.map(r=>{
    const pwd=r.tipo==="senha";
    return `<div class="req ${pwd?'pwd':''}">
      <div class="req-top">
        <div class="avt" style="background:${pwd?'var(--c-dir)':'var(--or2)'}">${iniciais(r.nome)}</div>
        <div style="flex:1;min-width:0">
          <div class="req-name">${r.nome}</div>
          <div class="req-mail">${r.email}</div>
        </div>
        <span class="req-tag ${pwd?'tag-pwd':'tag-cad'}">${pwd?'Senha':'Cadastro'}</span>
      </div>
      <div style="font-size:.68rem;color:var(--t3)">${pwd?'Pediu redefinição de senha':'Solicitou acesso ao sistema'} · ${r.quando}</div>
      <div class="req-actions">
        <button class="ap" onclick="aprovar(${r.id})">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          ${pwd?'Aprovar e redefinir':'Aprovar'}
        </button>
        <button class="rj" onclick="rejeitar(${r.id})">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Recusar
        </button>
      </div>
    </div>`;
  }).join("");
}
function aprovar(id){
  const r=REQS.find(x=>x.id===id); if(!r) return;
  if(r.tipo==="cadastro"){
    USERS.push({id:++_id,nome:r.nome,email:r.email,grupo:"RH",role:"user",status:"active",
      empresas:[],perms:permsPadrao("RH")});
    toast(`${r.nome} aprovado — configure grupo e empresas`);
  } else { toast(`Senha de ${r.nome} redefinida — e-mail enviado`); }
  REQS=REQS.filter(x=>x.id!==id); renderAll();
}
function rejeitar(id){ const r=REQS.find(x=>x.id===id); REQS=REQS.filter(x=>x.id!==id); toast(`Solicitação de ${r.nome} recusada`); renderAll(); }

/* ── render usuários ── */
function renderUsers(){
  const q=(document.getElementById("busca").value||"").toLowerCase();
  const list=USERS.filter(u=>u.nome.toLowerCase().includes(q)||u.email.toLowerCase().includes(q));
  const el=document.getElementById("users");
  if(!list.length){ el.innerHTML=`<div class="empty">Nenhum usuário encontrado.</div>`; return; }
  el.innerHTML=list.map(u=>{
    const hex=grpHex(u.grupo);
    const nEdit=Object.values(u.perms).filter(v=>v===E).length;
    const nView=Object.values(u.perms).filter(v=>v===V).length;
    return `<div class="ucard">
      <div class="ucard-top">
        <div class="avt" style="width:42px;height:42px;background:${hex}">${iniciais(u.nome)}</div>
        <div style="flex:1;min-width:0">
          <div class="ucard-name">${u.nome}${u.you?`<span class="you">(você)</span>`:''}
            ${u.role==="admin"?`<span class="gbadge role-adm">ADM</span>`:''}</div>
          <div class="ucard-mail">${u.email}</div>
        </div>
        <span class="gbadge" style="background:${hex}22;color:${hex}">${u.grupo}</span>
      </div>
      <div class="meta">
        <span class="chiplet"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M6 21V7l6-4 6 4v14"/></svg>${u.empresas.length} empresas</span>
        <span class="chiplet"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>${nView} ver</span>
        <span class="chiplet"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>${nEdit} editar</span>
      </div>
      <div class="ucard-foot">
        <button class="iact" title="Editar" onclick="openUser(${u.id})"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        <button class="iact" title="Alterar senha" onclick="openSenha(${u.id})"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="3.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg></button>
        ${!u.you?`<button class="iact" title="${u.role==='admin'?'Tornar usuário':'Promover a admin'}" onclick="toggleRole(${u.id})"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6 4.3 2.3 7.3L12 16.7 5.7 21l2.3-7.3-6-4.3h7.6Z"/></svg></button>`:''}
        <div style="flex:1"></div>
        ${!u.you?`<button class="iact dg" title="Excluir" onclick="excluir(${u.id})"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>`:''}
      </div>
    </div>`;
  }).join("");
}
function toggleRole(id){ const u=USERS.find(x=>x.id===id); u.role=u.role==="admin"?"user":"admin"; toast(`${u.nome}: ${u.role==="admin"?"promovido a admin":"agora é usuário"}`); renderAll(); }
function excluir(id){ const u=USERS.find(x=>x.id===id); if(!confirm(`Excluir ${u.nome}?`))return; USERS=USERS.filter(x=>x.id!==id); toast("Usuário excluído"); renderAll(); }

/* ── modal usuário ── */
let draft=null;
function openUser(id){
  const editing = id!=null;
  const u = editing ? USERS.find(x=>x.id===id) : null;
  draft = editing
    ? {id:u.id, grupo:u.grupo, empresas:new Set(u.empresas), perms:{...u.perms}}
    : {id:null, grupo:"Financeiro", empresas:new Set(), perms:permsPadrao("Financeiro")};
  document.getElementById("muTit").textContent = editing?"Editar usuário":"Novo usuário";
  document.getElementById("muId").value = editing?u.id:"";
  document.getElementById("muNome").value = editing?u.nome:"";
  document.getElementById("muMail").value = editing?u.email:"";
  renderGsel(); renderEmps(); renderPtbl();
  const m=document.getElementById("modUser"); m.style.display="flex"; setTimeout(()=>m.classList.add("op"),10);
}
function closeUser(){ const m=document.getElementById("modUser"); m.classList.remove("op"); setTimeout(()=>m.style.display="none",200); }
function renderGsel(){
  document.getElementById("gsel").innerHTML=GRUPOS.map(g=>
    `<div class="gopt ${g.id===draft.grupo?'on':''}" style="${g.id===draft.grupo?`background:${g.hex}`:''}" onclick="setGrupo('${g.id}')">${g.id}</div>`).join("");
}
function setGrupo(g){ draft.grupo=g; draft.perms=permsPadrao(g); renderGsel(); renderPtbl(); }
function renderEmps(){
  document.getElementById("emps").innerHTML=EMPRESAS.map((e,i)=>
    `<label class="emp"><input type="checkbox" ${draft.empresas.has(e)?'checked':''} onchange="toggleEmp('${e.replace(/'/g,"\\'")}',this.checked)"><span>${e}</span></label>`).join("");
  document.getElementById("selAll").textContent = draft.empresas.size===EMPRESAS.length?"Limpar seleção":"Selecionar todas";
}
function toggleEmp(e,on){ on?draft.empresas.add(e):draft.empresas.delete(e); renderEmps(); }
function toggleAllEmp(){ if(draft.empresas.size===EMPRESAS.length)draft.empresas.clear(); else EMPRESAS.forEach(e=>draft.empresas.add(e)); renderEmps(); }
function renderPtbl(){
  document.getElementById("ptbl").innerHTML=MODULOS.map(m=>{
    const lv=draft.perms[m];
    return `<div class="prow"><span class="pname">${m}</span>
      <div class="pgrp">
        <label class="pchk"><input type="checkbox" ${lv!==N?'checked':''} onchange="setPerm('${m}','v',this.checked)"></label>
        <label class="pchk"><input type="checkbox" ${lv===E?'checked':''} onchange="setPerm('${m}','e',this.checked)"></label>
      </div></div>`;
  }).join("");
}
function setPerm(m,which,on){
  if(which==='v'){ draft.perms[m]= on ? (draft.perms[m]===E?E:V) : N; }
  else { draft.perms[m]= on ? E : V; }
  renderPtbl();
}
function saveUser(){
  const nome=document.getElementById("muNome").value.trim();
  const email=document.getElementById("muMail").value.trim().toLowerCase();
  if(!nome){ toast("Informe o nome"); return; }
  if(!email.endsWith("@cajupar.com")){ toast("E-mail precisa ser @cajupar.com"); return; }
  const payload={grupo:draft.grupo,empresas:[...draft.empresas],perms:{...draft.perms}};
  if(draft.id){ const u=USERS.find(x=>x.id===draft.id); Object.assign(u,{nome,email},payload); toast("Usuário atualizado"); }
  else { USERS.push({id:++_id,nome,email,role:"user",status:"active",...payload}); toast("Usuário criado"); }
  closeUser(); renderAll();
}

/* ── modal senha ── */
function openSenha(id){ const u=USERS.find(x=>x.id===id); document.getElementById("msId").value=id;
  document.getElementById("msNome").textContent="Usuário: "+u.nome; document.getElementById("msS1").value="";
  document.getElementById("msS2").value=""; document.getElementById("msErr").textContent="";
  const m=document.getElementById("modSenha"); m.style.display="flex"; setTimeout(()=>m.classList.add("op"),10); }
function closeSenha(){ const m=document.getElementById("modSenha"); m.classList.remove("op"); setTimeout(()=>m.style.display="none",200); }
function saveSenha(){
  const s1=document.getElementById("msS1").value,s2=document.getElementById("msS2").value,err=document.getElementById("msErr");
  if(s1.length<6){err.textContent="Mínimo 6 caracteres.";return;}
  if(s1!==s2){err.textContent="As senhas não conferem.";return;}
  toast("Senha alterada com sucesso"); closeSenha();
}

/* ── util ── */
let _tt;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove("on"),2600); }
function toggleTema(){ const h=document.documentElement; h.dataset.theme=h.dataset.theme==="dark"?"light":"dark"; }
function renderAll(){ renderKpis(); renderReqs(); renderUsers(); }
renderAll();
</script>
</body>
</html>
